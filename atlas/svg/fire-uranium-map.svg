<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" font-family="DejaVu Sans, sans-serif">
  <rect width="800" height="820" fill="#faf6f0"/>
  <text x="12" y="24" font-size="15" font-weight="bold" fill="#333">Babylon Fire × uranová historie — jihovýchodní Utah</text>
  <text x="12" y="41" font-size="10" fill="#886">SCHÉMA, stav k 5. 7. 2026 (~90 000 akrů, 0 % kontrolováno) — polohy přibližné, neslouží k navigaci</text>

  <!-- rivers -->
  <path d="M 510 60 Q 450 140 385 235 Q 300 300 100 370 Q 60 380 20 390" fill="none" stroke="#7fb2d9" stroke-width="4" opacity="0.7"/>
  <text x="430" y="140" font-size="10" fill="#4477a0" transform="rotate(38 430 140)">Colorado River</text>
  <path d="M 780 590 Q 650 600 525 625 Q 440 650 370 681 Q 250 700 20 670" fill="none" stroke="#8fc2e0" stroke-width="3" opacity="0.7"/>
  <text x="600" y="592" font-size="10" fill="#4477a0">San Juan River</text>

  <!-- roads -->
  <g stroke="#999" stroke-width="2" fill="none">
    <path d="M 640 60 L 630 369 L 560 478 L 525 625 L 505 790"/>
    <path d="M 560 478 L 400 480 L 295 482 L 175 465 L 100 430"/>
    <path d="M 630 340 L 540 317 L 480 300"/>
    <path d="M 370 681 L 305 642 L 300 540 L 295 482"/>
    <path d="M 525 625 L 370 681"/>
  </g>
  <g font-size="9" fill="#777">
    <text x="643" y="200">US-191</text>
    <text x="445" y="500">UT-95</text>
    <text x="545" y="308">UT-211</text>
    <text x="308" y="575">UT-261</text>
    <text x="440" y="672">US-163</text>
  </g>

  <!-- fire perimeter -->
  <path d="M 330 470 Q 280 430 285 385 Q 295 330 340 300 Q 380 260 445 255 Q 490 260 495 300 Q 500 340 465 380 Q 450 430 400 465 Q 360 485 330 470 Z"
        fill="#e25822" opacity="0.28" stroke="#c03a10" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="390" y="368" font-size="13" fill="#a03010" font-weight="bold" text-anchor="middle">🔥 BABYLON FIRE</text>
  <text x="390" y="384" font-size="9" fill="#a03010" text-anchor="middle">Elk Ridge · Dark Canyon · Steamboat Peak</text>
  <text x="390" y="396" font-size="9" fill="#a03010" text-anchor="middle">šíří se SV ke Canyonlands</text>

  <!-- closure hint -->
  <path d="M 250 300 L 630 300 L 630 520 L 250 520" fill="none" stroke="#e0a020" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="510" y="514" font-size="8.5" fill="#b07d10">uzávěra: celý Monticello Ranger District</text>

  <!-- landmarks -->
  <g font-size="9.5" fill="#222">
    <circle cx="510" cy="60" r="4" fill="#333"/><text x="520" y="64">Moab</text>
    <circle cx="430" cy="95" r="4" fill="#333"/><text x="330" y="90">Dead Horse Pt ✓</text>
    <circle cx="425" cy="238" r="4" fill="#333"/><text x="433" y="234">Needles (uzavřen)</text>
    <circle cx="540" cy="317" r="4" fill="#333"/><text x="548" y="313">Newspaper Rock ?</text>
    <circle cx="630" cy="369" r="4" fill="#333"/><text x="640" y="373">Monticello</text>
    <circle cx="560" cy="478" r="4" fill="#333"/><text x="570" y="482">Blanding</text>
    <circle cx="365" cy="463" r="4" fill="#5a4"/><text x="308" y="480" fill="#464">Bears Ears</text>
    <circle cx="295" cy="482" r="4" fill="#333"/><text x="200" y="497">Natural Bridges ✕</text>
    <circle cx="525" cy="625" r="4" fill="#333"/><text x="533" y="622">Bluff</text>
    <circle cx="370" cy="681" r="4" fill="#333"/><text x="378" y="695">Mexican Hat</text>
    <circle cx="400" cy="628" r="4" fill="#333"/><text x="408" y="626">Valley of the Gods</text>
    <circle cx="305" cy="632" r="4" fill="#333"/><text x="215" y="628">Muley Point ?</text>
  </g>

  <!-- route -->
  <path d="M 430 95 L 480 300 L 540 317 L 630 340 L 630 369 L 560 478 L 525 625 L 370 681 L 305 642" fill="none" stroke="#b5522a" stroke-width="3" opacity="0.8"/>
  <path d="M 540 317 L 430 400 L 365 463 L 295 482 L 300 540 L 305 632" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="640" y="430" font-size="9" fill="#8a3d1f" font-weight="bold">— naše trasa</text>
  <text x="640" y="444" font-size="9" fill="#888">– – zrušená trasa</text>

  <!-- uranium sites: triangles mines, squares mills. red=inside, orange=edge, dim=outside -->
  <g>
    <path d="M 325 425 l 6 11 l -12 0 z" fill="#c03a10"/><text x="245" y="430" font-size="9" fill="#802000">Deer Flat ●uvnitř</text>
    <path d="M 355 330 l 6 11 l -12 0 z" fill="#c03a10"/><text x="272" y="335" font-size="9" fill="#802000">Elk Ridge ●uvnitř</text>
    <path d="M 258 415 l 6 11 l -12 0 z" fill="#e07820"/><text x="130" y="420" font-size="9" fill="#904d10">Happy Jack ◐u hranice</text>
    <path d="M 150 428 l 6 11 l -12 0 z" fill="#e07820"/><text x="60" y="452" font-size="9" fill="#904d10">White Canyon ◐západně</text>
    <path d="M 225 470 l 6 11 l -12 0 z" fill="#777"/><text x="150" y="492" font-size="9" fill="#555">Fry Canyon ○mimo</text>
    <path d="M 175 512 l 6 11 l -12 0 z" fill="#777"/><text x="100" y="534" font-size="9" fill="#555">Red Canyon ○mimo</text>
    <path d="M 685 238 l 6 11 l -12 0 z" fill="#777"/><text x="660" y="230" font-size="9" fill="#555">Mi Vida / Lisbon Valley ○mimo</text>
    <path d="M 275 745 l 6 11 l -12 0 z" fill="#777"/><text x="180" y="770" font-size="9" fill="#555">Monument No. 2 ○daleko J</text>
    <rect x="500" y="52" width="9" height="9" fill="#3a6" opacity="0.9" transform="translate(-25 8)"/><text x="395" y="48" font-size="9" fill="#256">Moab / Atlas Mill (odváženo)</text>
    <rect x="648" y="380" width="9" height="9" fill="#3a6"/><text x="660" y="389" font-size="9" fill="#256">Monticello Mill (sanováno)</text>
    <rect x="352" y="700" width="9" height="9" fill="#3a6"/><text x="364" y="709" font-size="9" fill="#256">Mexican Hat Mill / Halchita (sanováno)</text>
  </g>

  <!-- legend + scale -->
  <rect x="20" y="55" width="205" height="120" fill="#fff" stroke="#ccc" rx="6"/>
  <g font-size="9" fill="#333">
    <text x="30" y="73" font-weight="bold">Legenda</text>
    <path d="M 36 82 l 6 11 l -12 0 z" fill="#c03a10"/><text x="50" y="92">důl uvnitř požáru</text>
    <path d="M 36 100 l 6 11 l -12 0 z" fill="#e07820"/><text x="50" y="110">důl u hranice požáru</text>
    <path d="M 36 118 l 6 11 l -12 0 z" fill="#777"/><text x="50" y="128">důl mimo požár</text>
    <rect x="30" y="136" width="10" height="10" fill="#3a6"/><text x="50" y="145">úpravna / úložiště (sanováno)</text>
    <line x1="30" y1="160" x2="143" y2="160" stroke="#333" stroke-width="3"/><text x="150" y="164">≈ 20 km</text>
  </g>
</svg>
